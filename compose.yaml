services:

  db:
    image: postgres:17
    restart: always
    shm_size: 128mb
    env_file: .env
    ports:
        - 5432:5432
    volumes:
      - proforma_data:/var/lib/postgresql/data

  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080
  


volumes:
  proforma_data: